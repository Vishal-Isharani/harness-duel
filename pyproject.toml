[project]
name = "harness-duel"
version = "0.1.0"
description = "Did the harness change make the coding agent better? Run both, count task wins, sign test."
requires-python = ">=3.11"
dependencies = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
duel = "duel.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["duel"]

[tool.pytest.ini_options]
# Only the tool's own tests. The tests under examples/ belong to the example repo and the
# hidden task tests; they run inside agent workspaces, not here.
testpaths = ["tests"]